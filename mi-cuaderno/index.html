<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DIARIO"><meta name="description" content="Tus notas, tareas y libretas en un solo lugar."><title>DIARIO</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><main><section class="welcome"><h1>DIARIO</h1><p id="date"></p></section><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Encuentra cualquier nota o tarea" aria-label="Buscar notas y tareas"></label><section id="content"></section></main><nav aria-label="Navegación principal"><button data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg><span>Crear</span></button><button data-view="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Notas</span></button><button data-view="books"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 3v18M11 8h5"/></svg><span>Libretas</span></button><button data-view="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>Más</span></button></nav>
<dialog id="editor"><form id="note-form"><div class="dialog-head"><button type="button" id="cancel">Cancelar</button><strong id="editor-label">Nueva nota</strong><button class="save" type="submit">Guardar</button></div><input id="title" placeholder="Título" aria-label="Título" maxlength="200"><select id="book" aria-label="Libreta"></select><label class="reminder-label">Recordatorio<input id="reminder" type="datetime-local" aria-label="Fecha y hora del recordatorio"></label><button type="button" id="detect-reminder" class="reminder-detect">Reconocer fecha y hora del texto</button><p id="reminder-status" role="status" class="caption"></p><textarea id="body" placeholder="Empieza a escribir…" aria-label="Contenido"></textarea><div class="voice-controls"><button type="button" id="dictate" aria-pressed="false">🎙 Dictar texto</button><button type="button" id="record" aria-pressed="false">● Grabar audio</button></div><p id="voice-status" role="status" aria-live="polite"></p><p class="caption">El dictado usa el servicio de voz del navegador y puede necesitar conexión. También puedes usar el micrófono del teclado del iPhone.</p><label class="attachment">Adjuntar foto o archivo<input id="attachment" type="file" accept="image/*,application/pdf,audio/*"></label><div id="attachments"></div><button type="button" id="delete" class="danger">Eliminar nota</button></form></dialog><input id="import" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script src="app.js"></script></body></html>
