<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Cuaderno"><meta name="description" content="Tus notas, tareas y libretas en un solo lugar."><title>Mi Cuaderno</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><main><header><button class="avatar" aria-label="Abrir ajustes" data-view="more">L</button><span class="brand">MI CUADERNO</span><button class="round" aria-label="Ver tareas" data-view="tasks">✓</button></header><section class="welcome"><h1>Mi Cuaderno</h1><p id="date"></p></section><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Encuentra cualquier nota o tarea" aria-label="Buscar notas y tareas"></label><section id="content"></section></main><nav aria-label="Navegación principal"><button data-view="home">⊕<span>Crear</span></button><button data-view="notes">▤<span>Notas</span></button><button data-view="books">▣<span>Libretas</span></button><button data-view="more">•••<span>Más</span></button></nav>
<dialog id="editor"><form id="note-form"><div class="dialog-head"><button type="button" id="cancel">Cancelar</button><strong id="editor-label">Nueva nota</strong><button class="save" type="submit">Guardar</button></div><input id="title" placeholder="Título" aria-label="Título" maxlength="200"><select id="book" aria-label="Libreta"></select><textarea id="body" placeholder="Empieza a escribir…" aria-label="Contenido"></textarea><label class="attachment">Adjuntar foto o archivo<input id="attachment" type="file" accept="image/*,application/pdf,audio/*"></label><div id="attachments"></div><button type="button" id="delete" class="danger">Eliminar nota</button></form></dialog><input id="import" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script src="app.js"></script></body></html>
